[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Mezo testnet (chain id 31611). RPC comes from the environment so no endpoint
# is hard-coded into the repo. See .env.example.
[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC_URL}"
